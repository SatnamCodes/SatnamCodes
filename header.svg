<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-label="Satnam Singh">
<style>
  svg { --ink:#24292f; --mute:#656d76; --accent:#0969da; --rule:#d0d7de; }
  @media (prefers-color-scheme: dark) { svg { --ink:#e6edf3; --mute:#8b949e; --accent:#58a6ff; --rule:#30363d; } }
  text { font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
  .name { font-size:44px; fill:var(--ink); letter-spacing:6px; }
  .sub  { font-size:13.5px; fill:var(--mute); letter-spacing:2px; }
  .tag  { font-size:11px; fill:var(--mute); letter-spacing:3px; }

  #rule { stroke:var(--rule); stroke-width:1; stroke-dasharray:760; stroke-dashoffset:760;
          animation:draw 1.4s ease-out .1s forwards; }
  @keyframes draw { to { stroke-dashoffset:0 } }

  #wipe { animation:type 1.5s steps(12) .5s forwards; }
  @keyframes type { from { width:0 } to { width:556px } }

  #cur { fill:var(--accent); opacity:0; animation:blink 1.05s steps(1) 2s infinite; }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

  .rot { opacity:0; animation:cycle 12s ease-in-out infinite; }
  .rot:nth-of-type(1) { animation-delay:2.1s }
  .rot:nth-of-type(2) { animation-delay:6.1s }
  .rot:nth-of-type(3) { animation-delay:10.1s }
  @keyframes cycle {
    0%   { opacity:0 }
    4%   { opacity:1 }
    28%  { opacity:1 }
    33%  { opacity:0 }
    100% { opacity:0 }
  }

  #tag { opacity:0; animation:fade 1s ease-out 1.9s forwards }
  @keyframes fade { to { opacity:1 } }
</style>

<defs>
  <clipPath id="c"><rect id="wipe" x="30" y="20" width="0" height="70"/></clipPath>
</defs>

<text class="tag" id="tag" x="30" y="34">// PHYSICS &#183; MATHEMATICS &#183; COMPUTATION</text>

<g clip-path="url(#c)">
  <text class="name" x="30" y="82" textLength="520" lengthAdjust="spacing">SATNAM SINGH</text>
</g>
<rect id="cur" x="562" y="52" width="12" height="34"/>

<line id="rule" x1="30" y1="106" x2="790" y2="106"/>

<g>
  <text class="sub rot" x="30" y="136">building things that must survive execution</text>
  <text class="sub rot" x="30" y="136">CUDA kernels &#183; graph neural nets &#183; RISC-V internals</text>
  <text class="sub rot" x="30" y="136">169.6 GFLOPS &#8594; 1052.9 GFLOPS, and not done yet</text>
</g>
</svg>
