<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totem · SatnamCodes</title>
<meta name="description" content="A spinning top set going by the last two weeks of work on GitHub. Flick it to spin it yourself.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 15 3 8.5C3 6 5 5 8 5s5 1 5 3.5zM7.3 5V1h1.4v4z%22 fill=%22%23d9a35b%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #000; --floor: #121210; --ink: #e8e6e1; --mute: #8a8780; --faint: #34332f; --accent: #d9a35b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f2ec; --floor: #e8e5dc; --ink: #141412; --mute: #6c6a64; --faint: #d6d3ca; --accent: #9a5f17; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 500 11px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hud { position: fixed; color: var(--mute); pointer-events: none; }
  .hud a { pointer-events: auto; color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--faint); }
  .hud a:hover, .hud a:focus-visible { color: var(--ink); border-color: currentColor; outline: none; }
  .tl { top: 28px; left: 32px; }
  .tr { top: 28px; right: 32px; text-align: right; }
  .bl { bottom: 28px; left: 32px; max-width: 46vw; }
  .br { bottom: 28px; right: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .title { color: var(--ink); letter-spacing: .5em; }
  .hint { position: fixed; left: 0; right: 0; bottom: 16vh; text-align: center; color: var(--mute);
          pointer-events: none; transition: opacity 1.2s ease; }
  .hint.gone { opacity: 0; }
  .accent { color: var(--accent); }
  @media (max-width: 640px) {
    .tl, .tr { top: 18px; } .tl, .bl { left: 18px; } .tr, .br { right: 18px; }
    .bl { max-width: none; right: 18px; bottom: 54px; } .br { bottom: 22px; }
    body { font-size: 10px; letter-spacing: .2em; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="A spinning top on a polished table. Flick it with a mouse or finger, or press Space, to spin it."></canvas>
<div class="hud tl"><span class="title">Totem</span></div>
<div class="hud tr"><a href="https://github.com/SatnamCodes">GitHub</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="https://satnamwanders.dev">satnamwanders.dev</a></div>
<div class="hud bl" id="measure">Measuring…</div>
<div class="hud br" id="readout" aria-hidden="true"></div>
<div class="hint" id="hint">Flick the top to spin it<span class="sr">, or press Space</span></div>
<p class="sr" aria-live="polite" id="live"></p>

<script>
(() => {
  // ---------------------------------------------------------------------------------------------
  // A heavy symmetric top, simplified but honest about the behaviour that matters:
  //  · spin bleeds away to friction at the tip and in the air;
  //  · it precesses, and the slower it spins the faster it precesses (Ω ≈ mgl / Iω);
  //  · above a critical spin it "sleeps" upright; below it, the lean grows until it falls;
  //  · a fallen top rocks to rest on its rim and knob.
  // ---------------------------------------------------------------------------------------------
  const MGL_OVER_I = 70; // sets the precession rate: Ω = MGL_OVER_I / ω
  const W_CRIT = 20; // rad/s: the sleeping-top threshold
  const FALL = 1.2; // rad: past this lean it goes over

  const top = {
    spin: 0, // ψ, rad
    w: 0, // spin rate, rad/s (sign is direction)
    lean: 0.04, // θ, rad
    az: 0, // φ, precession azimuth, rad
    fallen: false,
    fallT: 0, // 0 → 1 while falling over
    fallFrom: 0,
    fallDir: 1,
  };

  const S = { // the measurement, from totem.json
    state: "spinning", last14: null, active14: null, measuredAt: null, steadiness: 0.6, fallen: false,
  };

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, dpr = 1, scale = 1;
  const colors = {};

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ["bg", "floor", "ink", "mute", "faint", "accent"]) colors[k] = cs.getPropertyValue(`--${k}`).trim();
    const light = matchMedia("(prefers-color-scheme: light)").matches;
    colors.metal = light
      ? ["#4a4a48", "#a9a9a4", "#fbfbf8", "#9b9b96", "#3c3c3a"]
      : ["#2b2b2b", "#9a9a96", "#efefe9", "#8c8c88", "#1f1f1f"];
    colors.shadow = light ? "58,53,48" : "0,0,0";
  }

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    scale = Math.min(w / 520, h / 420, 2.1);
  }

  // The same profile as the README's top: tip at the origin, axis up (negative y).
  const BODY = new Path2D([
    "M 0 0", "C 6 -4, 16 -22, 30 -44", "C 40 -58, 52 -70, 54 -80", "C 55 -86, 50 -94, 40 -99",
    "C 30 -103, 14 -105, 6 -106", "L 6 -138", "C 6 -144, 10 -146, 10 -150", "C 10 -156, 4 -158, 0 -158",
    "C -4 -158, -10 -156, -10 -150", "C -10 -146, -6 -144, -6 -138", "L -6 -106",
    "C -14 -105, -30 -103, -40 -99", "C -50 -94, -55 -86, -54 -80", "C -52 -70, -40 -58, -30 -44",
    "C -16 -22, -6 -4, 0 0 Z",
  ].join(" "));

  // How the top lies once fallen (the same pose the README's still top uses).
  const REST = (() => {
    const rim = [-54, -80], knob = [-10, -152];
    const outline = [rim, knob, [-55, -86], [-50, -94], [-40, -99], [-10, -146], [-10, -156], [-30, -44], [0, 0]];
    const turn = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a)];
    const gap = (a) => Math.abs(turn(rim, a)[1] - turn(knob, a)[1]);
    let best = -1.6;
    for (let a = -1.05; a >= -2.45; a -= 0.002) if (gap(a) < gap(best)) best = a;
    // Lifted so its lowest point is on the table, and moved so its middle sits over the old tip.
    return {
      angle: best,
      lift: Math.max(...outline.map((p) => turn(p, best)[1])),
      mid: turn([0, -80], best)[0],
    };
  })();

  function drawTop(screenTilt, squash, spin, speed, alpha, offX, offY) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(offX, offY);
    ctx.rotate(screenTilt);
    ctx.scale(1, squash);
    // Metal.
    const g = ctx.createLinearGradient(-56, 0, 56, 0);
    [0, 0.28, 0.42, 0.68, 1].forEach((o, i) => g.addColorStop(o, colors.metal[i]));
    ctx.fillStyle = g;
    ctx.fill(BODY);
    ctx.save();
    ctx.clip(BODY);
    // Grooves and the brass band.
    ctx.strokeStyle = colors.metal[0];
    ctx.globalAlpha = alpha * 0.55;
    ctx.lineWidth = 0.8;
    for (const [y, r] of [[-62, 47], [-72, 52], [-90, 46]]) {
      ctx.beginPath(); ctx.ellipse(0, y, r, 2.2, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = colors.accent;
    ctx.fillRect(-56, -83, 112, 7);
    // Highlights carried round by the spin: x = R·cos(ψ), visible on the near side only.
    const blur = Math.min(1, Math.abs(speed) / 60);
    for (let i = 0; i < 4; i++) {
      const a = spin + (i * Math.PI) / 2;
      const near = Math.sin(a);
      if (near <= 0) continue;
      const x = 52 * Math.cos(a);
      const width = 5 + 22 * blur;
      ctx.globalAlpha = alpha * near * (0.55 - 0.3 * blur);
      ctx.fillStyle = colors.metal[2];
      ctx.fillRect(x - width / 2, -110, width, 112);
    }
    ctx.restore();
    ctx.globalAlpha = alpha * 0.7;
    ctx.strokeStyle = colors.ink;
    ctx.lineWidth = 1.1 / scale;
    ctx.stroke(BODY);
    ctx.restore();
  }

  function frame(floorY) {
    // Where the axis points on screen: the lean seen side-on sways the top left and right; the part
    // towards or away from the viewer shortens it.
    let tilt, squash, offX = 0, offY = 0;
    if (top.fallen) {
      const k = 1 - Math.pow(1 - top.fallT, 3);
      tilt = top.fallDir * (top.fallFrom + (Math.abs(REST.angle) - top.fallFrom) * k);
      squash = 1;
      offX = -top.fallDir * Math.abs(REST.mid) * k;
      offY = -REST.lift * k;
      // A small rock as it settles.
      tilt += top.fallDir * 0.05 * Math.sin(top.fallT * 14) * (1 - top.fallT);
    } else {
      tilt = Math.atan2(Math.sin(top.lean) * Math.cos(top.az), Math.cos(top.lean));
      squash = Math.sqrt(Math.cos(top.lean) ** 2 + (Math.sin(top.lean) * Math.cos(top.az)) ** 2);
    }
    // Wobble in the tip contact makes the tip trace a small circle when slow.
    const tipX = top.fallen ? 0 : Math.sin(top.az) * top.lean * 10;

    ctx.save();
    ctx.translate(w / 2 + tipX * scale, floorY);
    ctx.scale(scale, scale);
    // Shadow.
    const sx = Math.sin(tilt) * 80;
    const sh = ctx.createRadialGradient(sx, 2, 0, sx, 2, 70 + Math.abs(sx) * 0.6);
    sh.addColorStop(0, `rgba(${colors.shadow},.5)`);
    sh.addColorStop(1, `rgba(${colors.shadow},0)`);
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.ellipse(sx, 2, 70 + Math.abs(sx) * 0.6, 8, 0, 0, Math.PI * 2); ctx.fill();
    // Reflection in the polished table.
    ctx.save();
    ctx.scale(1, -1);
    // Drawn with the same tilt: the flip itself mirrors the lean.
    drawTop(tilt, squash, top.spin, top.w, 0.16, offX, offY);
    ctx.restore();
    // The top.
    drawTop(tilt, squash, top.spin, top.w, 1, offX, offY);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const floorY = Math.round(h * 0.6);
    ctx.fillStyle = colors.bg; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = colors.floor; ctx.fillRect(0, floorY, w, h - floorY);
    ctx.fillStyle = colors.faint; ctx.fillRect(0, floorY, w, 1);
    frame(floorY);
    // Fade the reflection out down the table.
    const fade = ctx.createLinearGradient(0, floorY, 0, floorY + 180 * scale);
    fade.addColorStop(0, `${colors.floor}00`); // the floor colour, transparent: no grey band in light mode
    fade.addColorStop(1, colors.floor);
    ctx.fillStyle = fade; ctx.fillRect(0, floorY + 1, w, h - floorY);
  }

  // ---------------------------------------------------------------------------------------------
  function step(dt) {
    if (top.fallen) {
      top.fallT = Math.min(1, top.fallT + dt * 1.6);
      top.w *= Math.exp(-dt * 3);
      top.spin += top.w * dt * 0.3;
      return;
    }
    const s = Math.abs(top.w);
    // Friction: a little constant drag at the tip, a little proportional drag in the air.
    const drag = 0.55 + 0.018 * s;
    top.w = Math.sign(top.w) * Math.max(0, s - drag * dt);
    top.spin += top.w * dt;
    // Precession: slower spin, faster precession (capped so a near-stopped top doesn't whirl).
    top.az += Math.min(9, MGL_OVER_I / Math.max(s, 1)) * dt * (top.w >= 0 ? 1 : -1);
    // Sleeping above the threshold; toppling below it.
    if (s > W_CRIT) top.lean += (0.035 - top.lean) * dt * 0.6 * (1 - W_CRIT / s);
    else top.lean += dt * (0.05 + top.lean * 1.4) * (1 - s / W_CRIT);
    if (top.lean >= FALL) fallOver();
  }

  function fallOver() {
    top.fallen = true;
    top.fallT = 0;
    top.fallFrom = Math.abs(Math.atan2(Math.sin(top.lean) * Math.cos(top.az), Math.cos(top.lean)));
    top.fallDir = Math.cos(top.az) >= 0 ? 1 : -1;
    announce("The top has fallen. Flick it to spin it again.");
  }

  function spinUp(dw) {
    if (top.fallen) {
      // Pick it up and set it on its tip.
      top.fallen = false;
      top.lean = 0.12;
      top.az = 0;
      top.w = 0;
    }
    const dir = Math.sign(dw) || 1;
    top.w = dir * Math.min(110, Math.abs(top.w) + Math.abs(dw));
    hint.classList.add("gone");
    wake();
  }

  // ---------------------------------------------------------------------------------------------
  // Interaction: a horizontal flick across the top spins it; its speed sets the spin.
  const hint = document.getElementById("hint");
  let drag = null;
  cv.addEventListener("pointerdown", (e) => {
    cv.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, t: performance.now(), vx: 0, moved: 0 };
  });
  cv.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const now = performance.now();
    const dt = Math.max(1, now - drag.t) / 1000;
    const vx = (e.clientX - drag.x) / dt;
    drag.vx = drag.vx * 0.5 + vx * 0.5;
    drag.moved += Math.abs(e.clientX - drag.x);
    drag.x = e.clientX; drag.t = now;
  });
  cv.addEventListener("pointerup", () => {
    if (!drag) return;
    // A tap is a small twist; a flick adds spin in proportion to its speed.
    const dw = drag.moved < 6 ? 18 : Math.sign(drag.vx) * Math.min(90, Math.abs(drag.vx) * 0.045);
    drag = null;
    spinUp(dw);
  });
  cv.addEventListener("pointercancel", () => (drag = null));
  cv.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); spinUp(55); announce("Spinning."); }
  });
  addEventListener("keydown", (e) => {
    if (e.key === " " && document.activeElement === document.body) { e.preventDefault(); cv.focus(); spinUp(55); }
  });

  const live = document.getElementById("live");
  const announce = (t) => (live.textContent = t);

  // ---------------------------------------------------------------------------------------------
  const readout = document.getElementById("readout");
  function hud() {
    const rps = Math.abs(top.w) / (2 * Math.PI);
    const leanDeg = top.fallen ? 90 : (top.lean * 180) / Math.PI;
    readout.innerHTML = top.fallen
      ? `<span class="accent">At rest</span>`
      : `${(rps * 60).toFixed(0).padStart(4, " ")} rpm&nbsp;&nbsp;·&nbsp;&nbsp;lean ${leanDeg.toFixed(1).padStart(4, " ")}°`;
  }

  let raf = 0, last = 0;
  function tick(ms) {
    const now = ms / 1000;
    const dt = last ? Math.min(0.05, now - last) : 0;
    last = now;
    // Sub-steps keep the precession smooth at high spin.
    for (let i = 0; i < 4; i++) step(dt / 4);
    draw();
    hud();
    const moving = !top.fallen || top.fallT < 1;
    raf = moving && document.visibilityState === "visible" ? requestAnimationFrame(tick) : 0;
    if (!raf) last = 0;
  }
  function wake() { if (!raf) raf = requestAnimationFrame(tick); }

  readColors(); size(); draw();
  addEventListener("resize", () => { size(); draw(); wake(); });
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { readColors(); draw(); });
  document.addEventListener("visibilitychange", wake);

  // ---------------------------------------------------------------------------------------------
  // The starting spin comes from the measurement: steady work sets it going fast and upright.
  const fmt = (iso) => new Date(`${iso}T00:00:00Z`).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  fetch("totem.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
    .then((m) => Object.assign(S, m))
    .catch(() => {})
    .finally(() => {
      const el = document.getElementById("measure");
      if (S.last14 != null) {
        el.innerHTML = S.fallen
          ? `At rest: no work for ${S.idleDays} days<br>Measured ${fmt(S.measuredAt)}`
          : `Set spinning by ${S.last14} contributions in 14 days<br><span class="accent">${S.state}</span> · measured ${fmt(S.measuredAt)}`;
      } else el.textContent = "Flick to spin";
      if (S.fallen) {
        top.fallen = true; top.fallT = 1; top.fallDir = -1; top.fallFrom = Math.abs(REST.angle);
      } else {
        top.w = 14 + 70 * (S.steadiness ?? 0.6);
        top.lean = ((S.leanDeg ?? 6) * Math.PI) / 180;
      }
      announce(S.fallen ? "The top is at rest. Flick it to spin it." : `The top is ${S.state}.`);
      if (reduced) { draw(); hud(); } else wake();
    });
})();
</script>
</body>
</html>
