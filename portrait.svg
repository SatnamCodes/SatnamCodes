<svg xmlns="http://www.w3.org/2000/svg" width="550" height="572" viewBox="0 0 550 572" role="img" aria-label="ASCII portrait">
<style>
  svg { --ink:#24292f; --scan:#0969da; }
  @media (prefers-color-scheme: dark) { svg { --ink:#e6edf3; --scan:#58a6ff; } }
  text { font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace; font-size:9.0px; fill:var(--ink); white-space:pre; }
  .r { opacity:0; animation:in .8s ease-out forwards; }
  @keyframes in { from {opacity:0} to {opacity:.9} }
  #scan { animation:sweep 8s cubic-bezier(.45,0,.25,1) 3s infinite; }
  @keyframes sweep {
    0%{transform:translateY(0);opacity:0}
    5%{opacity:.5}
    60%{opacity:.5}
    72%{transform:translateY(572px);opacity:0}
    100%{transform:translateY(572px);opacity:0}
  }
</style>
<defs><linearGradient id="g"><stop offset="0" stop-color="var(--scan)" stop-opacity="0"/><stop offset=".5" stop-color="var(--scan)"/><stop offset="1" stop-color="var(--scan)" stop-opacity="0"/></linearGradient></defs>
