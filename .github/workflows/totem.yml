# The totem is measured once a day from the contribution calendar and redrawn:
# the top, its blueprint, the example states, the heatmap, totem/state.json and the README blocks.
name: Totem

on:
  schedule:
    - cron: "47 5 * * *" # daily, 11:17 in India
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["totem/build.mjs", "totem/profile.mjs", ".github/workflows/totem.yml"]

permissions:
  contents: write

concurrency:
  group: totem
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Measure and redraw
        run: node totem/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/totem.svg assets/blueprint-*.svg assets/heatmap-*.svg assets/states totem/state.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "Totem: measured $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
