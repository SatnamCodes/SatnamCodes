# Anyone on GitHub can spin the top: opening an issue titled "spin" runs this. It records who
# spun it, redraws the top spinning fast, signs their name under it, and closes the issue.
name: Spin

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One redraw at a time, shared with the daily measurement.
concurrency:
  group: totem
  cancel-in-progress: false

jobs:
  spin:
    if: ${{ startsWith(github.event.issue.title, 'spin') || startsWith(github.event.issue.title, 'Spin') || startsWith(github.event.issue.title, 'SPIN') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Spin and redraw
        run: node totem/build.mjs
        env:
          SPINNER: ${{ github.event.issue.user.login }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/totem.svg totem/state.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "Totem: spun by @${SPINNER}"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
        env:
          SPINNER: ${{ github.event.issue.user.login }}
      - name: Thank them and close the issue
        run: |
          gh issue comment "$NUMBER" --body "Spun. Your name is under the top now: https://github.com/${GITHUB_REPOSITORY_OWNER} (refresh if it hasn't changed yet). Thank you for stopping by."
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
