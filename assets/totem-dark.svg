<svg xmlns="http://www.w3.org/2000/svg" width="840" height="352" viewBox="0 0 840 352" role="img" aria-labelledby="totem-dark-t">
<title id="totem-dark-t">A spinning top, spinning true: 46 contributions on 6 of the last 14 days. It turns once every 0.369 seconds and leans 3.33 degrees as it precesses.</title>
<style>
  .sway { transform-box: view-box; transform-origin: 420px 268px;
          animation: sway 6.226s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3.33deg) } to { transform: rotate(3.33deg) } }
  .shadow { transform-box: view-box; transform-origin: 420px 268px;
            animation: drift 6.226s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-7.3px) scaleX(1.056) }
                     to   { transform: translateX(7.3px) scaleX(1.056) } }
  .streak { opacity: 0; animation: turn 0.369s linear infinite; }
  @keyframes turn {
    0%   { transform: translateX(-52px) scaleX(.3); opacity: 0 }
    12%  { opacity: .9 }
    25%  { transform: translateX(-37px) scaleX(.75) }
    50%  { transform: translateX(0) scaleX(1); opacity: 1 }
    75%  { transform: translateX(37px) scaleX(.75) }
    88%  { opacity: .9 }
    100% { transform: translateX(52px) scaleX(.3); opacity: 0 }
  }
  .caption { font: 500 10.5px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 3.2px; fill: #8a8780; }
  .rise { opacity: 0; animation: rise 1.6s ease-out .3s forwards; }
  @keyframes rise { to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) {
    .sway, .shadow, .streak, .rise { animation: none; opacity: 1; }
    .streak { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="totem-dark-metal" x1="-56" x2="56" y1="0" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2b2b2b"/><stop offset="0.28" stop-color="#9a9a96"/><stop offset="0.42" stop-color="#efefe9"/><stop offset="0.68" stop-color="#8c8c88"/><stop offset="1" stop-color="#1f1f1f"/>
  </linearGradient>
  <clipPath id="totem-dark-clip"><path d="M 0 0 C 6 -4, 16 -22, 30 -44 C 40 -58, 52 -70, 54 -80 C 55 -86, 50 -94, 40 -99 C 30 -103, 14 -105, 6 -106 L 6 -138 C 6 -144, 10 -146, 10 -150 C 10 -156, 4 -158, 0 -158 C -4 -158, -10 -156, -10 -150 C -10 -146, -6 -144, -6 -138 L -6 -106 C -14 -105, -30 -103, -40 -99 C -50 -94, -55 -86, -54 -80 C -52 -70, -40 -58, -30 -44 C -16 -22, -6 -4, 0 0 Z"/></clipPath>
  <radialGradient id="totem-dark-shadow"><stop offset="0" stop-color="#000000" stop-opacity=".55"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
  <linearGradient id="totem-dark-fade" x1="0" x2="0" y1="268" y2="358" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="totem-dark-reflect"><rect x="0" y="268" width="840" height="84" fill="url(#totem-dark-fade)"/></mask>
</defs>
<rect width="840" height="352" fill="#000000"/>
<rect x="0" y="268" width="840" height="84" fill="#151513"/>
<line x1="0" y1="268.5" x2="840" y2="268.5" stroke="#3a3936"/>
<ellipse class="shadow" cx="420" cy="270" rx="64" ry="7" fill="url(#totem-dark-shadow)"/>
<!-- The polished table's reflection: the same top, mirrored across the floor line. -->
<g class="mirror" mask="url(#totem-dark-reflect)">
  <g transform="translate(0 536) scale(1 -1)">
    <g class="sway"><g transform="translate(420 268)">
    <g clip-path="url(#totem-dark-r-clip)">
      <path d="M 0 0 C 6 -4, 16 -22, 30 -44 C 40 -58, 52 -70, 54 -80 C 55 -86, 50 -94, 40 -99 C 30 -103, 14 -105, 6 -106 L 6 -138 C 6 -144, 10 -146, 10 -150 C 10 -156, 4 -158, 0 -158 C -4 -158, -10 -156, -10 -150 C -10 -146, -6 -144, -6 -138 L -6 -106 C -14 -105, -30 -103, -40 -99 C -50 -94, -55 -86, -54 -80 C -52 -70, -40 -58, -30 -44 C -16 -22, -6 -4, 0 0 Z" fill="url(#totem-dark-r-metal)"/>
      <ellipse cx="0" cy="-62" rx="47" ry="2.2" fill="none" stroke="#2b2b2b" stroke-opacity=".55" stroke-width=".8"/><ellipse cx="0" cy="-72" rx="52" ry="2.2" fill="none" stroke="#2b2b2b" stroke-opacity=".55" stroke-width=".8"/><ellipse cx="0" cy="-90" rx="46" ry="2.2" fill="none" stroke="#2b2b2b" stroke-opacity=".55" stroke-width=".8"/>
      <rect x="-56" y="-83" width="112" height="7" fill="#d9a35b" opacity=".9"/>
      <g class="streaks" opacity=".5"><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.000s"/><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.092s"/><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.184s"/><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.277s"/></g>
    </g>
    <path d="M 0 0 C 6 -4, 16 -22, 30 -44 C 40 -58, 52 -70, 54 -80 C 55 -86, 50 -94, 40 -99 C 30 -103, 14 -105, 6 -106 L 6 -138 C 6 -144, 10 -146, 10 -150 C 10 -156, 4 -158, 0 -158 C -4 -158, -10 -156, -10 -150 C -10 -146, -6 -144, -6 -138 L -6 -106 C -14 -105, -30 -103, -40 -99 C -50 -94, -55 -86, -54 -80 C -52 -70, -40 -58, -30 -44 C -16 -22, -6 -4, 0 0 Z" fill="none" stroke="#e8e6e1" stroke-opacity=".7" stroke-width="1.1"/></g></g>
  </g>
</g>
<g class="sway"><g transform="translate(420 268)">
    <g clip-path="url(#totem-dark-clip)">
      <path d="M 0 0 C 6 -4, 16 -22, 30 -44 C 40 -58, 52 -70, 54 -80 C 55 -86, 50 -94, 40 -99 C 30 -103, 14 -105, 6 -106 L 6 -138 C 6 -144, 10 -146, 10 -150 C 10 -156, 4 -158, 0 -158 C -4 -158, -10 -156, -10 -150 C -10 -146, -6 -144, -6 -138 L -6 -106 C -14 -105, -30 -103, -40 -99 C -50 -94, -55 -86, -54 -80 C -52 -70, -40 -58, -30 -44 C -16 -22, -6 -4, 0 0 Z" fill="url(#totem-dark-metal)"/>
      <ellipse cx="0" cy="-62" rx="47" ry="2.2" fill="none" stroke="#2b2b2b" stroke-opacity=".55" stroke-width=".8"/><ellipse cx="0" cy="-72" rx="52" ry="2.2" fill="none" stroke="#2b2b2b" stroke-opacity=".55" stroke-width=".8"/><ellipse cx="0" cy="-90" rx="46" ry="2.2" fill="none" stroke="#2b2b2b" stroke-opacity=".55" stroke-width=".8"/>
      <rect x="-56" y="-83" width="112" height="7" fill="#d9a35b" opacity=".9"/>
      <g class="streaks" opacity=".5"><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.000s"/><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.092s"/><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.184s"/><rect class="streak" x="-3" y="-108" width="6" height="110" fill="#efefe9" style="animation-delay:-0.277s"/></g>
    </g>
    <path d="M 0 0 C 6 -4, 16 -22, 30 -44 C 40 -58, 52 -70, 54 -80 C 55 -86, 50 -94, 40 -99 C 30 -103, 14 -105, 6 -106 L 6 -138 C 6 -144, 10 -146, 10 -150 C 10 -156, 4 -158, 0 -158 C -4 -158, -10 -156, -10 -150 C -10 -146, -6 -144, -6 -138 L -6 -106 C -14 -105, -30 -103, -40 -99 C -50 -94, -55 -86, -54 -80 C -52 -70, -40 -58, -30 -44 C -16 -22, -6 -4, 0 0 Z" fill="none" stroke="#e8e6e1" stroke-opacity=".7" stroke-width="1.1"/></g></g>
<text class="caption rise" x="36" y="330">SPINNING TRUE   ·   46 CONTRIBUTIONS IN 14 DAYS   ·   MEASURED 9 OCT 2026</text>
