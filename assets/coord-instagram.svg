<svg xmlns="http://www.w3.org/2000/svg" width="200" height="76" viewBox="0 0 200 76" role="img" aria-label="INSTAGRAM dontblamesatnam">
<style>
  svg { --ink:#24292f; --mute:#656d76; --faint:#8c959f; --accent:#0969da; --rule:#d0d7de; }
  @media (prefers-color-scheme: dark) { svg { --ink:#e6edf3; --mute:#8b949e; --faint:#6e7681; --accent:#58a6ff; --rule:#30363d; } }
  text { font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
  .plat { font-size:9px; fill:var(--faint); letter-spacing:3px; }
  .hnd  { font-size:11px; fill:var(--ink); }
  .cross { stroke:var(--rule); stroke-width:1; }
  #hx { animation:hslide 7s cubic-bezier(.3,0,.2,1) 0.7s infinite }
  #vy { animation:vslide 7s cubic-bezier(.3,0,.2,1) 0.7s infinite }
  @keyframes hslide { 0%{transform:translateX(-200px);opacity:0} 8%{opacity:1} 26%{transform:translateX(0)} 88%{transform:translateX(0);opacity:1} 96%,100%{transform:translateX(0);opacity:0} }
  @keyframes vslide { 0%{transform:translateY(-76px);opacity:0} 8%{opacity:1} 26%{transform:translateY(0)} 88%{transform:translateY(0);opacity:1} 96%,100%{transform:translateY(0);opacity:0} }
  #lock { fill:none; stroke:var(--accent); stroke-width:1.25; opacity:0;
           animation:lock 7s cubic-bezier(.2,.8,.3,1) 0.7s infinite; transform-box:fill-box; transform-origin:center }
  @keyframes lock { 0%,24%{opacity:0;transform:scale(2.6) rotate(0deg)} 34%{opacity:1;transform:scale(1) rotate(45deg)} 88%{opacity:1;transform:scale(1) rotate(45deg)} 96%,100%{opacity:0;transform:scale(1) rotate(45deg)} }
  .fade { opacity:0; animation:fi 7s ease-out infinite }
  #f1 { animation-delay:0.7s } #f2 { animation-delay:0.82s }
  @keyframes fi { 0%,30%{opacity:0} 40%{opacity:1} 88%{opacity:1} 96%,100%{opacity:0} }
</style>
<line class="cross" id="hx" x1="0" y1="38" x2="200" y2="38"/>
<line class="cross" id="vy" x1="26" y1="0" x2="26" y2="76"/>
<rect id="lock" x="20.5" y="32.5" width="11" height="11"/>
<text class="plat fade" id="f1" x="48" y="32">INSTAGRAM</text>
<text class="hnd fade"  id="f2" x="48" y="50">dontblamesatnam</text>
</svg>
