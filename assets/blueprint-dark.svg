<text x="400" y="251.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#9198a1" text-anchor="middle"><tspan fill="#d9a35b">56.2</tspan> TURNS A SECOND</text>
<text x="400" y="265.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#9198a1" text-anchor="middle">SHOWN 84× SLOWER · AXIS ROUND EVERY 0.532 S</text>

<!-- Notes. -->
<text style="white-space:pre" x="560" y="46" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">1. MEASURED DAILY FROM THE CALENDAR.</text>
<text style="white-space:pre" x="560" y="63" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">2. STEADINESS = 0.6 × MOMENTUM + 0.4 × RHYTHM.</text>
<text style="white-space:pre" x="560" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">3. STEEL, 53 G, CENTRE OF MASS 18.5 MM UP.</text>
<text style="white-space:pre" x="560" y="97" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">   BELOW 48 TURNS/S IT CANNOT STAND UPRIGHT;</text>
<text style="white-space:pre" x="560" y="114" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">   STEADINESS 0.5 SPINS IT AT EXACTLY THAT.</text>
<text style="white-space:pre" x="560" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">4. MOTION INTEGRATED FROM LAGRANGE'S</text>
<text style="white-space:pre" x="560" y="148" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">   EQUATIONS FOR A HEAVY SYMMETRIC TOP.</text>
<text style="white-space:pre" x="560" y="165" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#9198a1">5. AT REST AFTER 21 DAYS WITHOUT WORK.</text>

