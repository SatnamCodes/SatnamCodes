<text x="342.5" y="22" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#9198a1" letter-spacing="2">PLAN</text>
<text x="560" y="22" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#9198a1" letter-spacing="2">NOTES</text>

