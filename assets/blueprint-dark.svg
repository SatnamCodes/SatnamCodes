<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-labelledby="bp-title">
<title id="bp-title">Blueprint of the totem, measured 9 OCT 2026: spinning true, 46 contributions in the last 14 days against a usual fortnight of 7.5, steadiness 0.943. It turns once every 0.0178 seconds and leans 2.91 degrees.</title>
<style>
  .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2.2s ease-out .2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .turn { transform-box: view-box; transform-origin: 400px 160px; animation: turn 1.5s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0 } .turn { animation: none } }
</style>

<!-- Sheet border, as on a drawing. -->
<rect x="1" y="1" width="838" height="328" fill="none" stroke="#30363d"/>
