<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-label="From research question down to silicon — there's always room at the bottom">
<style>
  svg { --ink:#24292f; --mute:#656d76; --faint:#8c959f; --accent:#0969da; --rule:#d0d7de; }
  @media (prefers-color-scheme: dark) { svg { --ink:#e6edf3; --mute:#8b949e; --faint:#6e7681; --accent:#58a6ff; --rule:#30363d; } }
  text { font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace; }

  .lv    { font-size:12px; fill:var(--mute); letter-spacing:2px; }
  .lv.hi { fill:var(--ink); }
  .axis  { font-size:9.5px; fill:var(--faint); letter-spacing:3px; }
  .cell  { fill:none; stroke:var(--rule); stroke-width:1; }
  .glyph { font-size:9px; fill:var(--mute); }
  .eq    { font-size:11px; fill:var(--mute); letter-spacing:2px; }
  .room  { font-size:22px; fill:var(--ink); letter-spacing:5px; }
  .attr  { font-size:10px; fill:var(--faint); letter-spacing:3px; }

  /* ---------- ACT 1 : the stack ---------- */
  #stack { animation:zoom 20s cubic-bezier(.65,0,.35,1) infinite; transform-origin:410px 180px; }
  @keyframes zoom {
    0%,26%  { transform:scale(1);   opacity:1 }
    36%,44% { transform:scale(2.4); opacity:1 }
    50%,100%{ transform:scale(2.4); opacity:0 }
  }

  .row { opacity:0; animation:rowin 20s ease-out infinite; }
  @keyframes rowin { 0%{opacity:0} 5%{opacity:1} 44%{opacity:1} 50%,100%{opacity:0} }
  .row:nth-of-type(1){animation-delay:0.0s} .row:nth-of-type(2){animation-delay:0.4s}
  .row:nth-of-type(3){animation-delay:0.8s} .row:nth-of-type(4){animation-delay:1.2s}
  .row:nth-of-type(5){animation-delay:1.6s} .row:nth-of-type(6){animation-delay:2.0s}
  .row:nth-of-type(7){animation-delay:2.4s}

  /* every layer except the CUDA one dims away as we descend */
  .dim { animation:dimout 20s ease-in-out infinite }
  @keyframes dimout { 0%,24%{opacity:1} 34%,100%{opacity:0} }

  #probe { fill:var(--accent); animation:descend 20s cubic-bezier(.5,0,.5,1) infinite }
  @keyframes descend {
    0%,4%   { transform:translateY(0);    opacity:0 }
    8%      { transform:translateY(0);    opacity:1 }
    24%     { transform:translateY(120px);opacity:1 }
    30%     { transform:translateY(120px);opacity:0 }
    100%    { transform:translateY(120px);opacity:0 }
  }

  #axisline { stroke:var(--rule); stroke-width:1; stroke-dasharray:3 4;
              opacity:0; animation:axfade 20s ease-out infinite }
  @keyframes axfade { 0%{opacity:0} 6%{opacity:1} 26%{opacity:1} 32%,100%{opacity:0} }

  /* ---------- ACT 2 : the multiply ---------- */
  #mm { opacity:0; animation:mmin 20s ease-out infinite }
  @keyframes mmin { 0%,44%{opacity:0} 50%{opacity:1} 66%{opacity:1} 71%,100%{opacity:0} }

  .fill { fill:var(--accent); opacity:0; animation:pop 20s ease-out infinite }
  @keyframes pop { 0%,48%{opacity:0} 52%{opacity:.85} 66%{opacity:.85} 70%,100%{opacity:0} }

  #arow { fill:var(--accent); opacity:0; animation:scanrow 20s steps(1) infinite }
  @keyframes scanrow {
    0%,48%{opacity:0;transform:translateY(0)}
    52%{opacity:.16;transform:translateY(0)}
    56%{transform:translateY(24px)} 60%{transform:translateY(48px)}
    64%{transform:translateY(72px)} 67%{opacity:0;transform:translateY(72px)}
    100%{opacity:0;transform:translateY(72px)}
  }
  #bcol { fill:var(--accent); opacity:0; animation:scancol 20s steps(1) infinite }
  @keyframes scancol {
    0%,48%{opacity:0;transform:translateX(0)}
    52%{opacity:.16;transform:translateX(0)}
    53%{transform:translateX(24px)} 54%{transform:translateX(48px)}
    55%{transform:translateX(72px)} 56%{transform:translateX(0)}
    57%{transform:translateX(24px)} 58%{transform:translateX(48px)}
    59%{transform:translateX(72px)} 60%{transform:translateX(0)}
    61%{transform:translateX(24px)} 62%{transform:translateX(48px)}
    63%{transform:translateX(72px)} 64%{transform:translateX(0)}
    65%{transform:translateX(24px)} 66%{transform:translateX(48px)}
    67%{opacity:0} 100%{opacity:0}
  }

  /* ---------- ACT 3 : the line ---------- */
  .word { opacity:0; animation:reveal 20s cubic-bezier(.2,.7,.3,1) infinite; transform-origin:center }
  @keyframes reveal {
    0%,71%  { opacity:0; transform:translateY(8px) }
    76%     { opacity:1; transform:translateY(0) }
    95%     { opacity:1; transform:translateY(0) }
    99%,100%{ opacity:0; transform:translateY(0) }
  }
  .word:nth-of-type(1){animation-delay:0.0s} .word:nth-of-type(2){animation-delay:0.18s}
  .word:nth-of-type(3){animation-delay:0.36s} .word:nth-of-type(4){animation-delay:0.54s}
  .word:nth-of-type(5){animation-delay:0.72s} .word:nth-of-type(6){animation-delay:0.90s}
  #attr { opacity:0; animation:attrin 20s ease-out 1.3s infinite }
  @keyframes attrin { 0%,74%{opacity:0} 80%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0} }
</style>

<!-- ============ ACT 1 ============ -->
<g id="stack">
  <line id="axisline" x1="120" y1="52" x2="120" y2="308"/>
  <text class="axis" x="694" y="56">HIGH LEVEL</text>
  <text class="axis" x="694" y="312">LOW LEVEL</text>

  <g class="row dim"><rect x="140" y="48" width="540" height="1" fill="var(--rule)"/><text class="lv" x="140" y="42">RESEARCH QUESTION</text></g>
  <g class="row dim"><rect x="140" y="88" width="540" height="1" fill="var(--rule)"/><text class="lv" x="140" y="82">MODEL &#183; ARCHITECTURE</text></g>
  <g class="row dim"><rect x="140" y="128" width="540" height="1" fill="var(--rule)"/><text class="lv" x="140" y="122">FRAMEWORK &#183; PyTorch</text></g>
  <g class="row"><rect x="140" y="168" width="540" height="1" fill="var(--rule)"/><text class="lv hi" x="140" y="162">KERNEL &#183; CUDA</text></g>
  <g class="row dim"><rect x="140" y="208" width="540" height="1" fill="var(--rule)"/><text class="lv" x="140" y="202">WARP &#183; THREAD</text></g>
  <g class="row dim"><rect x="140" y="248" width="540" height="1" fill="var(--rule)"/><text class="lv" x="140" y="242">REGISTER &#183; SHARED MEMORY</text></g>
  <g class="row dim"><rect x="140" y="288" width="540" height="1" fill="var(--rule)"/><text class="lv" x="140" y="282">SILICON</text></g>

  <rect id="probe" x="116" y="36" width="8" height="8"/>
</g>

<!-- ============ ACT 2 ============ -->
<g id="mm">
  <text class="glyph" x="212" y="150">A</text>
  <text class="glyph" x="356" y="150">B</text>
  <text class="glyph" x="512" y="150">C</text>

  <g transform="translate(200,160)">
    <rect id="arow" x="0" y="0" width="96" height="24"/>
    <rect class="cell" x="0"  y="0"  width="96" height="96"/>
    <line class="cell" x1="0" y1="24" x2="96" y2="24"/><line class="cell" x1="0" y1="48" x2="96" y2="48"/><line class="cell" x1="0" y1="72" x2="96" y2="72"/>
    <line class="cell" x1="24" y1="0" x2="24" y2="96"/><line class="cell" x1="48" y1="0" x2="48" y2="96"/><line class="cell" x1="72" y1="0" x2="72" y2="96"/>
  </g>

  <text class="eq" x="312" y="214">&#215;</text>

  <g transform="translate(344,160)">
    <rect id="bcol" x="0" y="0" width="24" height="96"/>
    <rect class="cell" x="0"  y="0"  width="96" height="96"/>
    <line class="cell" x1="0" y1="24" x2="96" y2="24"/><line class="cell" x1="0" y1="48" x2="96" y2="48"/><line class="cell" x1="0" y1="72" x2="96" y2="72"/>
    <line class="cell" x1="24" y1="0" x2="24" y2="96"/><line class="cell" x1="48" y1="0" x2="48" y2="96"/><line class="cell" x1="72" y1="0" x2="72" y2="96"/>
  </g>

  <text class="eq" x="456" y="214">=</text>

  <g transform="translate(500,160)">
    <rect class="fill" x="0"  y="0"  width="24" height="24" style="animation-delay:0.00s"/>
    <rect class="fill" x="24" y="0"  width="24" height="24" style="animation-delay:0.20s"/>
    <rect class="fill" x="48" y="0"  width="24" height="24" style="animation-delay:0.40s"/>
    <rect class="fill" x="72" y="0"  width="24" height="24" style="animation-delay:0.60s"/>
    <rect class="fill" x="0"  y="24" width="24" height="24" style="animation-delay:0.80s"/>
    <rect class="fill" x="24" y="24" width="24" height="24" style="animation-delay:1.00s"/>
    <rect class="fill" x="48" y="24" width="24" height="24" style="animation-delay:1.20s"/>
    <rect class="fill" x="72" y="24" width="24" height="24" style="animation-delay:1.40s"/>
    <rect class="fill" x="0"  y="48" width="24" height="24" style="animation-delay:1.60s"/>
    <rect class="fill" x="24" y="48" width="24" height="24" style="animation-delay:1.80s"/>
    <rect class="fill" x="48" y="48" width="24" height="24" style="animation-delay:2.00s"/>
    <rect class="fill" x="72" y="48" width="24" height="24" style="animation-delay:2.20s"/>
    <rect class="fill" x="0"  y="72" width="24" height="24" style="animation-delay:2.40s"/>
    <rect class="fill" x="24" y="72" width="24" height="24" style="animation-delay:2.60s"/>
    <rect class="fill" x="48" y="72" width="24" height="24" style="animation-delay:2.80s"/>
    <rect class="fill" x="72" y="72" width="24" height="24" style="animation-delay:3.00s"/>
    <rect class="cell" x="0"  y="0"  width="96" height="96"/>
    <line class="cell" x1="0" y1="24" x2="96" y2="24"/><line class="cell" x1="0" y1="48" x2="96" y2="48"/><line class="cell" x1="0" y1="72" x2="96" y2="72"/>
    <line class="cell" x1="24" y1="0" x2="24" y2="96"/><line class="cell" x1="48" y1="0" x2="48" y2="96"/><line class="cell" x1="72" y1="0" x2="72" y2="96"/>
  </g>

  <text class="eq" x="410" y="300" text-anchor="middle">C = &#945;AB + &#946;C</text>
</g>

<!-- ============ ACT 3 ============ -->
<g>
  <text class="room word" x="110" y="214" textLength="122.4" lengthAdjust="spacing">THERE&#8217;S</text>
  <text class="room word" x="256" y="214" textLength="104.2" lengthAdjust="spacing">ALWAYS</text>
  <text class="room word" x="383" y="214" textLength="67.8" lengthAdjust="spacing">ROOM</text>
  <text class="room word" x="474" y="214" textLength="31.4" lengthAdjust="spacing">AT</text>
  <text class="room word" x="529" y="214" textLength="49.6" lengthAdjust="spacing">THE</text>
  <text class="room word" x="601" y="214" textLength="104.2" lengthAdjust="spacing">BOTTOM</text>
  <text class="attr" id="attr" x="410" y="252" text-anchor="middle">&#8212; AFTER FEYNMAN</text>
</g>
</svg>
